# so PackageVersion here may lag the published package. See the "How CI keeps it
# current" section of README.md in this directory for the version-lag policy.
PackageIdentifier: OpenGeos.DeepGis
PackageVersion: 1.5.0
PackageLocale: en-US
Publisher: OpenGeos
PublisherUrl: https://github.com/opengeos
PublisherSupportUrl: https://github.com/gaojunke/DeepGis/issues
Author: DeepGis Contributors
PackageName: DeepGis Desktop
PackageUrl: https://github.com/gaojunke/DeepGis/
License: MIT
LicenseUrl: https://github.com/gaojunke/DeepGis/blob/main/LICENSE
Copyright: Copyright (c) 2026 Qiusheng Wu
ShortDescription: Lightweight, cloud-native GIS platform for visualizing and analyzing geospatial data
Description: |-
  DeepGis is a lightweight, cloud-native desktop GIS for visualizing and
  analyzing geospatial data, built on MapLibre with deck.gl for 3D and
  point-cloud overlays. It loads vector and raster files, web services, 3D
  Tiles, MBTiles, and cloud-native formats, and is extensible through a plugin
  ecosystem.
Moniker: geolibre
Tags:
